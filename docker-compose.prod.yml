services:
  api:
    image: 592193419505.dkr.ecr.ap-southeast-2.amazonaws.com/voymate-server:latest
    container_name: voymate-api
    restart: unless-stopped
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN}
    deploy:
      resources:
        limits:
          memory: 250M
    networks:
      - app-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  app-network:
    external: true
