services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
      - '9229:9229'
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN}
      # - .env
      # DATABASE_URL: ${DATABASE_URL}
      # REDIS_URL: ${REDIS_URL}
      # NODE_ENV: ${NODE_ENV}
      # PORT: ${PORT}
    command: sh -c "doppler run -- sh -c 'npm run db:generate && npm run dev'"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${DB_USER:-nasif}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_DB: ${DB_NAME:-voymate}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USER:-nasif} -d ${DB_NAME:-voymate}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/var/lib/redis/data

