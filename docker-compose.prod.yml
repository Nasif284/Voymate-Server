services:
  api:
    image: 592193419505.dkr.ecr.ap-southeast-2.amazonaws.com/voymate-server:latest
    ports:
      - '5000:5000'
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN}
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
